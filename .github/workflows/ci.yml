# Parallel CI quality and release-readiness gates.
name: CI

on:
  push:
    branches: [main, "feat/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 9.12.3
  NODE_VERSION: 22
  BUNDLE_BUDGET_KB: 10240

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma:validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/auth_ci
      - run: pnpm lint
      - run: pnpm typecheck

  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/auth_ci
      NEXTAUTH_SECRET: ci-nextauth-secret-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm test:coverage

  build-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral OAuth RSA keypair
        run: |
          PRIVATE_KEY=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null)
          PUBLIC_KEY=$(printf '%s' "$PRIVATE_KEY" | openssl rsa -pubout 2>/dev/null)
          test -n "$PRIVATE_KEY"
          test -n "$PUBLIC_KEY"
          while IFS= read -r line; do echo "::add-mask::$line"; done <<< "$PRIVATE_KEY"
          while IFS= read -r line; do echo "::add-mask::$line"; done <<< "$PUBLIC_KEY"
          {
            echo 'OAUTH_JWT_PRIVATE_KEY<<EOF'
            printf '%s\n' "$PRIVATE_KEY"
            echo 'EOF'
            echo 'OAUTH_JWT_PUBLIC_KEY<<EOF'
            printf '%s\n' "$PUBLIC_KEY"
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - run: pnpm build
        env: &build-env
          NEXT_TELEMETRY_DISABLED: "1"
          CI: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_e2e
          NEXTAUTH_SECRET: ci-nextauth-secret-32chars-padded-x
          AUTH_URL: https://auth.example.com
          UPSTASH_REDIS_REST_URL: http://127.0.0.1:8079
          UPSTASH_REDIS_REST_TOKEN: dummy-upstash-token
          OTP_HMAC_SECRET: ci-otp-hmac-secret-32chars-padded-
          ACCOUNT_LINK_PKCE_SECRET: ci-account-link-pkce-secret-32chars-
          GITHUB_LINK_CLIENT_ID: ci-github-link-client
          GITHUB_LINK_CLIENT_SECRET: ci-github-link-client-secret
          SELF_SERVICE_REGISTRATION_ENABLED: "false"
          OAUTH_JWT_PRIVATE_KEY: ${{ env.OAUTH_JWT_PRIVATE_KEY }}
          OAUTH_JWT_PUBLIC_KEY: ${{ env.OAUTH_JWT_PUBLIC_KEY }}
          TURNSTILE_SECRET_KEY: ci-turnstile
          TURNSTILE_EXPECTED_HOSTNAME: auth.example.com
          TURNSTILE_EXPECTED_ACTION: gated-registration
          INTERNAL_WORKER_AUTH_SECRET: ci-worker-secret-32chars-padded-xx
          QSTASH_URL: https://qstash.upstash.io
          QSTASH_TOKEN: qstash-build-fixture
          RESEND_API_KEY: re_ci_nonsecret_build_fixture
          INVITE_DELIVERY_ENCRYPTION_KEYS: '{"1":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
          INVITE_DELIVERY_KEY_VERSION: "1"
          ADMIN_MFA_SECRET_ENCRYPTION_KEYS: '{"1":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}'
          ADMIN_MFA_SECRET_KEY_VERSION: "1"
      - name: Enforce client bundle budget
        run: |
          BUNDLE_KB=$(du -sk .next/static | cut -f1)
          test "$BUNDLE_KB" -le "$BUNDLE_BUDGET_KB"
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-bundle
    env:
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auth_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - name: Verify downloaded production build
        run: |
          test -f .next/BUILD_ID
          test -f .next/routes-manifest.json
          test -d .next/server
      - name: Generate ephemeral OAuth RSA keypair
        run: |
          PRIVATE_KEY=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null)
          PUBLIC_KEY=$(printf '%s' "$PRIVATE_KEY" | openssl rsa -pubout 2>/dev/null)
          test -n "$PRIVATE_KEY"
          test -n "$PUBLIC_KEY"
          while IFS= read -r line; do echo "::add-mask::$line"; done <<< "$PRIVATE_KEY"
          while IFS= read -r line; do echo "::add-mask::$line"; done <<< "$PUBLIC_KEY"
          {
            echo 'OAUTH_JWT_PRIVATE_KEY<<EOF'
            printf '%s\n' "$PRIVATE_KEY"
            echo 'EOF'
            echo 'OAUTH_JWT_PUBLIC_KEY<<EOF'
            printf '%s\n' "$PUBLIC_KEY"
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - name: Prepare disposable E2E database
        run: pnpm prisma:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_e2e
      - name: Start downloaded built application
        env: *build-env
        run: |
          pnpm start >"$RUNNER_TEMP/built-app.log" 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:3000/api/healthz >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/built-app.log"
          exit 1
      - name: Database-backed built auth golden path
        env: *build-env
        run: pnpm e2e:built-auth
      - name: Stop built application
        if: always()
        run: kill "$APP_PID" 2>/dev/null || true

  migration-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_ci
      MIGRATION_DATABASE_NAME: auth_ci
      MIGRATION_SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_shadow
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_ci
      NEXTAUTH_SECRET: ci-nextauth-secret-at-least-thirty-two-characters
      AUTH_URL: https://auth.example.com
      ADMIN_MFA_SECRET_ENCRYPTION_KEYS: '{"1":"1111111111111111111111111111111111111111111111111111111111111111"}'
      ADMIN_MFA_SECRET_KEY_VERSION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: psql postgresql://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE auth_shadow'
      - name: Exercise clean apply and disposable schema down/up rehearsal
        run: pnpm migration:readiness:ci
      - name: Print schema diff after readiness failure
        if: failure()
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$MIGRATION_SHADOW_DATABASE_URL" \
            --script || true
      - name: Verify PostgreSQL behavioral invariants
        run: pnpm test:db:gated-registration
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm audit --prod --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
